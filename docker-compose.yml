version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-local
    ports:
      - "5678:5678"
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      - GENERIC_TIMEZONE=Europe/Paris
    volumes:
      - ~/.n8n:/home/node/.n8n
      - ./:/project
    # Importe/écrase le workflow puis démarre n8n
    command: ["/bin/sh", "-lc", "n8n import:workflow --input=/project/workflow-final-optimized.json --overwrite && n8n start"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
